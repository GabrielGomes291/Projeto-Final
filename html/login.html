<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <title>RedLine Atlas - Login</title>
</head>
<body class="d-flex align-items-center min-vh-100">
    <main class="container" style="max-width: 460px">
        <a href="home.html" class="btn-outline theme-inverse mb-3">← Voltar</a>

        <div class="caixa">
            <h1 class="fs-3xl text-center mb-4">Acesse sua conta!</h1>

            <form id="formulario" class="vstack gap-4" data-tipo="login" data-bs-validate novalidate>
                <div class="form-field">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" class="form-control" required>
                    <div class="invalid-feedback">Digite um e-mail válido.</div>
                </div>
                <div class="form-field">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" id="senha" class="form-control" minlength="6" required>
                    <div class="invalid-feedback">A senha precisa ter no mínimo 6 caracteres.</div>
                </div>
                <button type="submit" class="btn-solid theme-danger">Entrar</button>
            </form>

            <p class="text-center mt-3 mb-0">Não tem uma conta? <a href="cadastro.html">Criar conta</a></p>
        </div>
    </main>
   <!-- mensagem de que graças a Deus deu certo-->
    <div id="avisoLogin" class="alert alert-success mt-3"
     style="display: none;" role="status">
    Login efetuado!
</div>

    <script src="../js/script.js"></script>
</body>
</html>
